[project]
name = "mlops-data-student"
version = "0.1.0"
description = "Data versioning practice: DVC and ClearML Dataset"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dvc>=3.50,<4",
    "clearml>=1.16,<2",
    "scikit-learn>=1.5",
    "pandas>=2.2",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
